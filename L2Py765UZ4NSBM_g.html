<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Согласование тендеров</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
<style>
    body { background-color: #0d1117; color: #c9d1d9; }
    .glass { background: #161b22; border: 1px solid #30363d; }
    
    /* Чистый контейнер GitHub Markdown */
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 100%;
      margin: 0 auto;
      padding: 32px;
      background-color: #0d1117 !important;
      border: 1px solid #30363d;
      border-radius: 12px;
    }

    /* Адаптив для мобильных устройств */
    @media (max-width: 767px) {
      .markdown-body {
        padding: 16px;
      }
    }
	
	
	/* Базовый контейнер */
  .markdown-body {
    box-sizing: border-box;
    width: 100%;
    padding: 28px;
    background-color: #0d1117 !important;
    border: 1px solid #30363d;
    border-radius: 12px;
  }

  /* МОБИЛЬНАЯ АДАПТАЦИЯ (экран меньше 768px) */
  @media (max-width: 767px) {
    /* Снимаем отступы у всего экрана */
    body {
      padding: 8px 4px !important;
    }

    /* Убираем рамки, фоны и паддинги у карточки */
    .glass {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
    }

    /* Растягиваем markdown-body на всю ширину */
    .markdown-body {
      padding: 10px 6px !important;
      border: none !important;
      border-radius: 0 !important;
      background-color: transparent !important;
    }

    /* Перенос статуса, если не влезает в заголовок */
    #view-detail .border-b {
      flex-direction: column !important;
      gap: 8px !important;
    }

    /* Фикс горизонтального скролла для таблиц на телефоне */
    .markdown-body table {
      display: block !important;
      overflow-x: auto !important;
      white-space: nowrap !important;
    }
	    /* Перенос статуса, если не влезает в заголовок */
    #view-detail .border-b {
      flex-direction: column !important;
      gap: 8px !important;
    }

    /* Фикс горизонтального скролла для таблиц на телефоне */
    .markdown-body table {
      display: block !important;
      overflow-x: auto !important;
      white-space: nowrap !important;
    }
	
	/* Разрешаем перенос слов и текста внутри всех таблиц */
#detail-body table {
  width: 100% !important;
  table-layout: auto;
  word-break: break-word;
  overflow-wrap: break-word;
}

#detail-body th, 
#detail-body td {
  white-space: normal !important; /* Разрешает перенос на новую строку */
  padding: 8px 10px;
}

/* Фиксируем минимальную ширину для первой колонки (Вопрос/Показатель) */
#detail-body td:first-child,
#detail-body th:first-child {
  min-width: 110px;
  max-width: 140px;
  font-weight: 600;
}
  }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-[95%] xl:max-w-[1600px] mx-auto">
    <!-- Шапка -->
    <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">Тендерный отдел</h1>
        <p class="text-xs text-slate-400">Панель согласования закупок</p>
      </div>
      <button onclick="clearToken()" class="text-xs text-slate-500 hover:text-rose-400 underline">Выйти</button>
    </header>

    <!-- Авторизация -->
    <div id="auth-card" class="max-w-md mx-auto bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <h2 class="text-sm font-semibold mb-2 text-slate-200">Авторизация доступа</h2>
      <p class="text-xs text-slate-400 mb-4">Введите токен доступа GitHub (PAT).</p>
      <input type="password" id="pat-token" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm mb-4 focus:outline-none focus:border-emerald-500 text-slate-100" placeholder="ghp_xxxxxxxxxxxx">
      <button onclick="saveToken()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-semibold text-sm transition">Сохранить и войти</button>
    </div>

    <!-- Индикатор загрузки -->
    <div id="loading" class="hidden text-center py-12 text-slate-400 text-sm">
      Загрузка тендеров...
    </div>

    <!-- ОСНОВНОЙ БЛОК -->
    <main id="app-content" class="hidden">
      
      <!-- ЭКРАН 1: СПИСОК -->
      <section id="view-list" class="space-y-4">
        <div class="flex justify-between items-center mb-2">
		<!-- Вкладки: На согласовании / Участвуем / Отклоненные -->
          <div class="flex space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
            <button id="tab-open" onclick="switchTab('open')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white transition">
              📋 На согласовании
            </button>
            <button id="tab-participate" onclick="switchTab('participate')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition">
              🚀 Участвуем
            </button>
            <button id="tab-closed" onclick="switchTab('closed')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition">
              🚫 Отклоненные
            </button>
          </div>

          <button onclick="initDashboard()" class="text-xs text-emerald-400 hover:underline">🔄 Обновить</button>
        </div>

        <div class="glass rounded-2xl overflow-hidden shadow-xl border border-slate-700">
          <table class="w-full text-left text-sm">
				<thead class="bg-slate-800 text-slate-400 border-b border-slate-700">
				  <tr>
					<th class="p-3 md:p-4 w-12 md:w-20">№</th>
					<th class="p-3 md:p-4">Название тендера</th>
				  </tr>
				</thead>
            <tbody id="tenders-table-body" class="divide-y divide-slate-700/60">
            </tbody>
          </table>
        </div>
      </section>

      <!-- ЭКРАН 2: ДЕТАЛИ + КОММЕНТАРИИ -->
      <section id="view-detail" class="hidden space-y-4">
        <button onclick="showList()" class="inline-flex items-center gap-1.5 text-xs text-emerald-400 hover:text-emerald-300 font-medium">
          ← Назад к списку тендеров
        </button>

        <div class="glass rounded-2xl p-6 shadow-xl space-y-6">
          <div class="border-b border-slate-700 pb-4 flex justify-between items-start">
            <div>
              <span id="detail-number" class="text-xs font-mono text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">#0</span>
              <h2 id="detail-title" class="text-xl font-bold mt-2 text-slate-100"></h2>
            </div>
            <span id="detail-status-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider"></span>
          </div>

			<div id="detail-body" class="markdown-body"></div>
          </div>

			
			<div id="decision-section" class="border-t border-slate-700/80 pt-4 space-y-3">
			  <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">История решений и комментарии</h3>
            <div id="comments-container" class="space-y-2 max-h-48 overflow-y-auto">
            </div>
          </div>

          <!-- Форма действий -->
          <div class="border-t border-slate-700/80 pt-4 space-y-3">
            <textarea id="detail-comment" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-emerald-500" placeholder="Замечание или комментарий..." rows="2"></textarea>

            <div class="flex justify-end">
              <button id="btn-send-comment" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold transition active:scale-95">
                💬 Отправить комментарий
              </button>
            </div>

			<!-- Кнопки для АКТИВНОГО тендера -->
            <div id="actions-open" class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800">
              <button id="btn-approve" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-xs transition active:scale-95 shadow-md flex justify-center items-center gap-1.5">
                <span>🚀</span> Участвуем!
              </button>
              <button id="btn-reject" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold text-xs transition active:scale-95 shadow-md flex justify-center items-center gap-1.5">
                <span>🔴</span> Отклонить
              </button>
            </div>

            <!-- Кнопка для ОТКЛОНЕННОГО тендера -->
            <div id="actions-closed" class="hidden pt-2 border-t border-slate-800">
              <button id="btn-reopen" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold text-xs transition active:scale-95 shadow-md flex justify-center items-center gap-1.5">
                <span>🔄</span> Вернуть в работу (На согласование)
              </button>
            </div>
			
			
			<!-- Кнопка Назад внизу страницы -->
			<div class="pt-4 border-t border-slate-800 text-center">
			  <button onclick="showList()" class="inline-flex items-center gap-1.5 text-xs text-emerald-400 hover:text-emerald-300 font-medium py-2 px-4 rounded-lg bg-slate-900 border border-slate-800">
				← Назад к списку тендеров
			  </button>
			</div>
			
          </div>
        </div>
      </section>

    </main>
  </div>

 <script>
  const REPO_OWNER = 'urallpc-collab';
  const REPO_NAME = 'tenders-board';
  const PARTICIPATE_LABEL = 'участвуем';
  const CURRENT_USER = 'Тимур';
  let issuesStore = [];
  let currentTab = 'open'; // 'open', 'participate', 'closed'

  function getToken() { return localStorage.getItem('gh_pat_token') || ''; }

  function saveToken() {
    const token = document.getElementById('pat-token').value.trim();
    if (token) {
      localStorage.setItem('gh_pat_token', token);
      initDashboard();
    }
  }

  function clearToken() {
    localStorage.removeItem('gh_pat_token');
    location.reload();
  }
  
  // Функция плавного скролла к блоку комментариев и кнопок
  function scrollToDecisionBlock() {
    const section = document.getElementById('decision-section');
    if (section) {
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

	// Показ/скрытие полоски при скролле (СТРОГО только на экране деталей)
	  window.addEventListener('scroll', () => {
		const btn = document.getElementById('scroll-bottom-btn');
		const viewDetail = document.getElementById('view-detail');

		// Если мы НЕ на экране деталей тендера — кнопка ЖЕСТКО скрыта и дальше код не идет
		if (!viewDetail || viewDetail.classList.contains('hidden')) {
		  if (btn) btn.classList.add('hidden');
		  return;
		}

		const scrollPosition = window.innerHeight + window.scrollY;
		const threshold = document.documentElement.scrollHeight - 180; // 180px до самого низа

		// Если еще не дошли до низа — показываем кнопку
		if (scrollPosition < threshold) {
		  btn.classList.remove('hidden');
		} else {
		  btn.classList.add('hidden');
		}
	  });
  
		function showList(isBrowserBack = false) {
			// Принудительно скрываем кнопку скролла
			const scrollBtn = document.getElementById('scroll-bottom-btn');
			if (scrollBtn) scrollBtn.classList.add('hidden');

			document.getElementById('view-detail').classList.add('hidden');
			document.getElementById('view-list').classList.remove('hidden');

			if (!isBrowserBack && history.state && history.state.view === 'detail') {
			  history.back();
			}
		  }

  // Работа с локальными статусами (чтобы скрыть лаг GitHub API)
  function getLocalOverrides() {
    try {
      return JSON.parse(localStorage.getItem('pending_decisions') || '{}');
    } catch (e) { return {}; }
  }

  function setLocalOverride(issueNumber, action) {
    const overrides = getLocalOverrides();
    overrides[issueNumber] = { action, time: Date.now() };
    localStorage.setItem('pending_decisions', JSON.stringify(overrides));
  }

  function getReadTenders() {
    const token = getToken();
    if (!token) return [];
    const readData = localStorage.getItem(`read_tenders_${token}`);
    try { return readData ? JSON.parse(readData) : []; } catch (e) { return []; }
  }

  function markAsRead(issueNumber) {
    const token = getToken();
    if (!token) return;
    const readList = getReadTenders();
    if (!readList.includes(issueNumber)) {
      readList.push(issueNumber);
      localStorage.setItem(`read_tenders_${token}`, JSON.stringify(readList));
    }
  }

  // Переключение вкладок
  async function switchTab(tab) {
    currentTab = tab;

    const tabOpen = document.getElementById('tab-open');
    const tabParticipate = document.getElementById('tab-participate');
    const tabClosed = document.getElementById('tab-closed');

    [tabOpen, tabParticipate, tabClosed].forEach(t => {
      if (t) t.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition';
    });

    if (tab === 'open') {
      tabOpen.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white transition';
    } else if (tab === 'participate') {
      tabParticipate.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition';
    } else {
      tabClosed.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-600 text-white transition';
    }

    await initDashboard();
  }

  // Загрузка и фильтрация тендеров с учётом кэша
  async function initDashboard() {
    const token = getToken();
    if (!token) {
      document.getElementById('auth-card').classList.remove('hidden');
      document.getElementById('app-content').classList.add('hidden');
      return;
    }

    document.getElementById('auth-card').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('app-content').classList.add('hidden');

    try {
      // Запрашиваем и открытые, и закрытые задачи для точного учета переходов
      const [openRes, closedRes] = await Promise.all([
        fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=open&per_page=100`, { headers: { 'Authorization': `token ${token}` } }),
        fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=closed&per_page=100`, { headers: { 'Authorization': `token ${token}` } })
      ]);

      const openIssues = await openRes.json();
      const closedIssues = await closedRes.json();
      const allIssues = [...openIssues, ...closedIssues];
      const overrides = getLocalOverrides();

      // Фильтрация по разделам с мгновенной подстановкой локальных статусов
      issuesStore = allIssues.filter(issue => {
        if (issue.pull_request) return false;

        let hasParticipateLabel = issue.labels.some(l => l.name.toLowerCase() === PARTICIPATE_LABEL);
        let isClosed = issue.state === 'closed';

        // Если есть локальное решение, перекрываем старые данные GitHub
        if (overrides[issue.number]) {
          const local = overrides[issue.number];
          if (local.action === 'participate') {
            hasParticipateLabel = true;
            isClosed = false;
          } else if (local.action === 'reject') {
            isClosed = true;
          } else if (local.action === 'reopen') {
            hasParticipateLabel = false;
            isClosed = false;
          }
        }

        if (currentTab === 'open') {
          return !hasParticipateLabel && !isClosed;
        } else if (currentTab === 'participate') {
          return hasParticipateLabel && !isClosed;
        } else {
          return isClosed;
        }
      });

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');

      renderTable();
      showList();
    } catch (err) {
      alert('Ошибка загрузки данных. Проверьте токен.');
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('auth-card').classList.remove('hidden');
    }
  }

function renderTable() {
    const tbody = document.getElementById('tenders-table-body');
    tbody.innerHTML = '';

    if (!issuesStore || issuesStore.length === 0) {
      let msg = 'Нет тендеров на согласовании 🎉';
      if (currentTab === 'participate') msg = 'Нет тендеров в разделе «Участвуем» 🚀';
      if (currentTab === 'closed') msg = 'Нет отклоненных тендеров 👌';

      tbody.innerHTML = `<tr><td colspan="2" class="p-8 text-center text-slate-500 text-sm">${msg}</td></tr>`;
      return;
    }

    const readList = getReadTenders();

    issuesStore.forEach(issue => {
      const isRead = readList.includes(issue.number);
      const tr = document.createElement('tr');

      // 1. Для прочитанных заголовков берем более светлый серый text-slate-400 вместо text-slate-500
      // 2. Убираем opacity-60, чтобы зеленый цвет № не тускнел
      const textStyle = isRead ? 'text-slate-400 font-normal' : 'text-slate-100 font-semibold';
      const bgStyle = isRead ? 'bg-slate-900/30 hover:bg-slate-800/50' : 'hover:bg-slate-800/60';

      tr.className = `${bgStyle} transition cursor-pointer`;
      tr.onclick = () => openDetail(issue.number);

      // Номер всегда остается ярко-зеленым (text-emerald-400)
      tr.innerHTML = `
        <td class="p-3 md:p-4 font-mono text-xs text-emerald-400 font-medium">#${issue.number}</td>
        <td class="p-3 md:p-4 text-sm ${textStyle}">${issue.title}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function openDetail(issueNumber) {
    const issue = issuesStore.find(i => i.number === issueNumber);
    if (!issue) return;

    markAsRead(issue.number);
    renderTable();

    document.getElementById('detail-number').innerText = `#${issue.number}`;
    document.getElementById('detail-title').innerText = issue.title;

    const badge = document.getElementById('detail-status-badge');
    const overrides = getLocalOverrides();
    
    let hasParticipate = issue.labels.some(l => l.name.toLowerCase() === PARTICIPATE_LABEL);
    let isClosed = issue.state === 'closed';

    if (overrides[issue.number]) {
      const local = overrides[issue.number];
      if (local.action === 'participate') { hasParticipate = true; isClosed = false; }
      else if (local.action === 'reject') { isClosed = true; }
      else if (local.action === 'reopen') { hasParticipate = false; isClosed = false; }
    }

    if (isClosed) {
      badge.innerText = 'Отклонен';
      badge.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-rose-950 text-rose-400 border border-rose-800';
      document.getElementById('actions-open').classList.add('hidden');
      document.getElementById('actions-closed').classList.remove('hidden');
    } else if (hasParticipate) {
      badge.innerText = 'Идем в торги';
      badge.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-blue-950 text-blue-400 border border-blue-800';
      document.getElementById('actions-open').classList.add('hidden');
      document.getElementById('actions-closed').classList.remove('hidden');
    } else {
      badge.innerText = 'На согласовании';
      badge.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-emerald-950 text-emerald-400 border border-emerald-800';
      document.getElementById('actions-open').classList.remove('hidden');
      document.getElementById('actions-closed').classList.add('hidden');
    }

    let rawText = issue.body || 'Описание отсутствует.';
    rawText = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    rawText = rawText.replace(/<style[\s\S]*?<\/style>/gi, '');
    rawText = rawText.replace(/<!--[\s\S]*?-->/g, '');

    const detailBody = document.getElementById('detail-body');
    if (detailBody) {
      if (typeof marked !== 'undefined') {
        marked.setOptions({ gfm: true, breaks: true });
        detailBody.innerHTML = marked.parse(rawText);
      } else {
        detailBody.innerText = rawText;
      }
    }

    document.getElementById('detail-comment').value = '';

    document.getElementById('btn-send-comment').onclick = () => addCommentOnly(issue.number);
    document.getElementById('btn-approve').onclick = () => decision(issue.number, 'participate');
    document.getElementById('btn-reject').onclick = () => decision(issue.number, 'reject');
    document.getElementById('btn-reopen').onclick = () => decision(issue.number, 'reopen');

    await loadComments(issue.number);

    document.getElementById('view-list').classList.add('hidden');
    document.getElementById('view-detail').classList.remove('hidden');
	// запоминаем состояние в истории браузера
    history.pushState({ view: 'detail', issueNumber }, '', `#tender-${issueNumber}`);
  }

  async function loadComments(issueNumber) {
    const token = getToken();
    const container = document.getElementById('comments-container');
    container.innerHTML = `<p class="text-xs text-slate-500">Загрузка комментариев...</p>`;

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}/comments`, {
        headers: { 'Authorization': `token ${token}` }
      });
      const comments = await res.json();

      if (!comments || comments.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 italic">Комментариев и решений пока нет.</p>`;
        return;
      }

		container.innerHTML = '';
		comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'bg-slate-900/90 border border-slate-800 p-3 rounded-lg text-xs text-slate-300';
        
        // 1. Ищем имя автора в начале текста (👤 **Имя**: ...)
        let authorName = c.user.login; // Запасной вариант, если имя не найдено
        let displayBody = c.body;

		const match = c.body.match(/^👤 \*\*(.*?)\*\*:?\s*([\s\S]*)$/);
		if (match) {
		  authorName = match[1]; // Достаем имя ("Ильгиз", "Руслан" и т.д.)
		  displayBody = match[2]; // Оставляем только текст после имени
		}

        // 2. Выводим найденное имя вместо логина GitHub
        item.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-emerald-400">${authorName}</span>
            <span class="text-[10px] text-slate-500">${new Date(c.created_at).toLocaleString('ru-RU')}</span>
          </div>
          <div class="whitespace-pre-line text-slate-200">${displayBody}</div>
        `;
        container.appendChild(item);
      });
    } catch (e) {
      container.innerHTML = `<p class="text-xs text-rose-400">Ошибка загрузки комментариев.</p>`;
    }
  }

  async function addCommentOnly(issueNumber) {
    const token = getToken();
    const textarea = document.getElementById('detail-comment');
    const commentText = textarea.value.trim();

    if (!commentText) return;

    textarea.disabled = true;
    await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}/comments`, {
      method: 'POST',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: `👤 **${CURRENT_USER}**: ${commentText}` })
    });

    textarea.value = '';
    textarea.disabled = false;
    await loadComments(issueNumber);
  }

		function showList(isBrowserBack = false) {
		  document.getElementById('view-detail').classList.add('hidden');
		  document.getElementById('view-list').classList.remove('hidden');

		  // Если нажали на кнопку на сайте, а не системную назад
		  if (!isBrowserBack && history.state && history.state.view === 'detail') {
			history.back();
		  }
		}

  // Принятие решения с записью локального кэша
  async function decision(issueNumber, action) {
    const token = getToken();
    const commentText = document.getElementById('detail-comment').value.trim();

    // 1. Мгновенно заносим в память браузера
    setLocalOverride(issueNumber, action);
    
    // Перерисовываем экран мгновенно
    await initDashboard();

    // 2. Фоновые запросы к GitHub
    try {
	// Собираем текст статуса и комментария
	  let actionText = action === 'participate' ? '🚀 Принято решение: Участвуем!' : 
					   action === 'reject' ? '🔴 Принято решение: Отклонить' : '🔄 Вернул в работу';
	  
	  let fullBody = `👤 **${CURRENT_USER}**: ${actionText}`;
	  if (commentText) fullBody += `\n💬 ${commentText}`;

	  fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}/comments`, {
		method: 'POST',
		headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
		body: JSON.stringify({ body: fullBody })
	  });

      if (action === 'participate') {
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}/labels`, {
          method: 'POST',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ labels: [PARTICIPATE_LABEL] })
        });
      } else if (action === 'reject') {
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}`, {
          method: 'PATCH',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: 'closed' })
        });
      } else if (action === 'reopen') {
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}`, {
          method: 'PATCH',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: 'open' })
        });
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issueNumber}/labels/${PARTICIPATE_LABEL}`, {
          method: 'DELETE',
          headers: { 'Authorization': `token ${token}` }
        });
      }
    } catch (err) {
      console.error('Ошибка фонового обновления:', err);
    }
  }
// Перехват системной кнопки "Назад" в браузере/на телефоне
  window.addEventListener('popstate', (event) => {
    if (event.state && event.state.view === 'detail') {
      openDetail(event.state.issueNumber);
    } else {
      showList(true);
    }
  });
  initDashboard();
</script>
<!-- Тонкая аккуратная полоска для быстрого скролла вниз/вверх -->
<div id="scroll-bottom-btn" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-40 hidden transition-all duration-300">
  <button onclick="scrollToDecisionBlock()" title="Перейти к решению и комментариям" class="group flex items-center justify-center bg-slate-950/90 hover:bg-slate-900 text-slate-400 hover:text-emerald-400 px-12 py-1 rounded-t-xl border-t border-x border-slate-800 shadow-2xl backdrop-blur-md transition-all active:scale-95">
    <span id="scroll-arrow" class="text-[10px] font-bold transition-transform duration-300 transform group-hover:translate-y-0.5">▼</span>
  </button>
</div>
</body>
